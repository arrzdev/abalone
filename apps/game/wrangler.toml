# CI deploy after build: wrangler deploy --config dist/server/wrangler.json
name = "abalone-game"
main = "@tanstack/react-start/server-entry"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = false
workers_dev = false

# The build selects this env with CLOUDFLARE_ENV (.github/scripts/deploy/app.sh)
# and bakes it into dist/server/wrangler.json. Named envs do not inherit `name`.
[env.production]
name = "abalone-game"
workers_dev = false
