# The top-level block is DEV. `wrangler dev` reads it, and the placeholder ids
# below never reach Cloudflare because local mode never calls the API. Production
# lives in [env.production] at the bottom and the deploy passes `--env production`
# (.github/scripts/deploy/app.sh) — without that flag it would ship this block.
name = "abalone-backend-dev"
main = "entrypoint/worker.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
minify = true
upload_source_maps = false
workers_dev = false

# Runtime env (FRONTEND_URLS, BETTER_AUTH_*, AVATAR_PUBLIC_URL) is deliberately
# NOT declared here. The deploy uploads it onto the Worker as secrets from the
# GH-action-written env/.env — `wrangler versions upload --secrets-file env/.env`,
# see .github/scripts/deploy/app.sh — so env is driven entirely by the GitHub
# environment's secrets/vars, never the CF dashboard.

# The environment name on every log line (src/utils/logging-config.ts). Vars are
# not inherited, so each env block below sets its own. Not in the env schema, so
# it never meets the secrets file the deploy uploads.
[vars]
DEPLOY_ENV = "local"

[dev]
ip = "0.0.0.0"
port = 8181
inspector_port = 9218

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "abalone-backend-db-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "src/database/migrations"

[[durable_objects.bindings]]
# `name`, not `binding` — durable objects are the one binding type that spells
# it differently, and wrangler rejects unknown keys rather than ignoring them.
name = "PUBSUB"
class_name = "PubSub"

# `migrations` IS inheritable, unlike bindings, so this block is written once and
# [env.production] picks it up — do not copy it down there.
#
# `new_sqlite_classes`, never `new_classes`: the sqlite backend is what the
# hibernation api is documented against and what the free plan requires, and a
# class's storage backend cannot be changed after it has been deployed once.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PubSub"]

[[r2_buckets]]
binding = "AVATARS"
# Local, and never created anywhere: with no `remote`, miniflare makes it on the
# spot under .wrangler/state. That keeps `pnpm dev` working with no network and
# no Cloudflare account — the whole point of local mode. What wrangler does not
# emulate is public-bucket HTTP access (workers-sdk#3687), so a local bucket has
# no address an <img> can reach; src/http/routes/avatars.routes.ts is the dev-only
# read path that stands in for cdn.abalone.tudu.dev, and it is gated on the same
# config-derived dev signal as CORS rather than on a build flag.
bucket_name = "abalone-avatars-dev"

# Cloudflare's own counters, shared by every isolate in a location, for the
# limiters a guess is worth making through (sign-in and the invite-link accept)
# and for the public health probe. The in-memory limiter in
# src/http/middlewares/rate-limit.ts counts per isolate, so behind enough
# isolates it barely limits at all. `limit`/`period` must match that file's
# comments (the binding allows a period of 10 or 60 s). `namespace_id` is any
# positive integer, unique per limiter in the account — other projects there
# already use 1001-1012, 2001-2012, 3001-3103 and 4001-4104, so abalone takes
# 5001+ (production) and 5101+ (dev). Local mode emulates these in miniflare,
# so dev and the test suite need no account either.
#
# Sign-in and sign-up: a burst tier against a script, a sustained one roomy
# enough for a household behind one NAT, and failed sign-ins per ip, which
# past its limit puts the ip in a 10-minute cooldown.
[[ratelimits]]
name = "AUTH_BURST_RATE_LIMITER"
namespace_id = "5101"
simple = { limit = 5, period = 10 }

[[ratelimits]]
name = "AUTH_SUSTAINED_RATE_LIMITER"
namespace_id = "5102"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "AUTH_FAILURE_RATE_LIMITER"
namespace_id = "5103"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "INVITE_LINK_RATE_LIMITER"
namespace_id = "5104"
simple = { limit = 20, period = 60 }

# The public /api/v1/health probe: unauthenticated and it reads D1 and R2, so
# it gets a ceiling of its own, far above any monitor's once-a-minute cadence.
[[ratelimits]]
name = "HEALTH_RATE_LIMITER"
namespace_id = "5105"
simple = { limit = 60, period = 60 }

# ---- production ----------------------------------------------------
# Bindings are NON-inheritable in wrangler, so this block redeclares the full set
# rather than patching the one above. `name` is set explicitly too: a named env
# otherwise deploys as `<top-level-name>-production`.

[env.production]
name = "abalone-backend"
# Pinned off, and pinned rather than left out: `triggers deploy` rewrites it
# every deploy, and a second public hostname in front of the auth handler is not
# something to publish by omission.
workers_dev = false
# The api shares the game's origins under /api, so the game calls it same-origin.
# A route beats the game Worker's custom domain on the same hostname, so these
# two patterns are all it takes; everything else on those hosts stays the game's.
routes = [
  { pattern = "abalone.tudu.dev/api/*", zone_name = "tudu.dev" },
  { pattern = "babaluje.tudu.dev/api/*", zone_name = "tudu.dev" },
]

[env.production.vars]
DEPLOY_ENV = "production"

# Workers Logs. Named envs do not inherit it reliably, so production repeats it.
[env.production.observability]
enabled = true
head_sampling_rate = 1

[[env.production.d1_databases]]
binding = "DB"
# The deploy reads this through wrangler's own config parser
# (.github/scripts/deploy/d1-databases.ts, which loads the `production` env) and
# migrates it — it is not derived from the worker name. Created once with
# `wrangler d1 create abalone-backend-db`; the id is not a secret (it names a
# database that only a bound Worker can reach) and lives here so the deploy has
# no lookup step.
database_name = "abalone-backend-db"
database_id = "8eff88f0-fa50-4d63-9dce-c0dfdafc1129"
migrations_dir = "src/database/migrations"

[[env.production.durable_objects.bindings]]
name = "PUBSUB"
class_name = "PubSub"

[[env.production.r2_buckets]]
binding = "AVATARS"
# `wrangler r2 bucket create abalone-avatars`, then attach cdn.abalone.tudu.dev
# to it in the dashboard (R2 → bucket → Settings → Public access → Custom domain).
# There is no wrangler equivalent for that step.
bucket_name = "abalone-avatars"

# Own namespace ids, not the dev block's: a counter is shared by every Worker
# that names the same id in the account.
[[env.production.ratelimits]]
name = "AUTH_BURST_RATE_LIMITER"
namespace_id = "5001"
simple = { limit = 5, period = 10 }

[[env.production.ratelimits]]
name = "AUTH_SUSTAINED_RATE_LIMITER"
namespace_id = "5002"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "AUTH_FAILURE_RATE_LIMITER"
namespace_id = "5003"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "INVITE_LINK_RATE_LIMITER"
namespace_id = "5004"
simple = { limit = 20, period = 60 }

[[env.production.ratelimits]]
name = "HEALTH_RATE_LIMITER"
namespace_id = "5005"
simple = { limit = 60, period = 60 }
