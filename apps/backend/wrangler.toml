name = "abalone-backend"
main = "entrypoint/worker.ts"
compatibility_date = "2026-03-17"
compatibility_flags = ["nodejs_compat"]
minify = true
upload_source_maps = false

# One environment: production, deployed off `main`. No [env.*] blocks, so nothing
# here is subject to Cloudflare's named-environment inheritance rules.

# Runtime env (FRONTEND_URL today) is deliberately NOT declared here. The deploy
# uploads it onto the Worker as secrets from the GH-action-written env/.env —
# `wrangler versions upload --secrets-file env/.env`, see
# .github/scripts/deploy/app.sh — so env is driven entirely by the GitHub
# environment's secrets/vars, never the CF dashboard.

[dev]
ip = "0.0.0.0"
port = 8181
inspector_port = 9218

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
# The deploy reads this name through wrangler's own config parser
# (.github/scripts/deploy/d1-databases.ts) and migrates it — it is not derived from
# the worker name. Create it once: `wrangler d1 create abalone-backend-db`, then
# paste its id below.
database_name = "abalone-backend-db"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
migrations_dir = "src/database/migrations"
