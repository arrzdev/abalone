name: E2E WebKit

# The main flows in WebKit at an iPhone 13 size. The TUDU VM cannot run
# WebKit, so this is where iPhone players get checked. Not part of the PR
# gate (the gate has its own browser run); trigger it by hand or wait for the
# weekly run. Public repo, standard hosted runner: no paid minutes.
on:
  workflow_dispatch:
    inputs:
      args:
        description: Extra playwright arguments, e.g. --repeat-each=10 --retries=0 e2e/language.spec.ts
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Seed build env from committed examples
        run: |
          for app in apps/*/; do
            [ -f "${app}env/.env.example" ] && cp "${app}env/.env.example" "${app}env/.env"
          done

      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: E2E (webkit-iphone)
        # Through env, not inlined: the input is never parsed as shell code.
        # $ARGS stays unquoted so it splits into separate arguments.
        env:
          ARGS: ${{ inputs.args }}
        run: pnpm exec playwright test --project=webkit-iphone $ARGS

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-webkit-iphone
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
