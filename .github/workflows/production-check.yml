name: Production check

# Once a day, ask production whether it is up: both frontends, the health route
# behind each of them, and one avatar on the CDN. A red check opens an issue
# titled `Production check failed` (or comments on the open one), so an outage
# reaches the on-call path through GitHub instead of through a player.
#
# Scheduled runs only fire from the default branch, and GitHub disables the
# schedule after 60 days without a commit; re-enable it from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-check
  cancel-in-progress: false

env:
  ISSUE_TITLE: Production check failed
  # Avatars are content-addressed and never deleted, so this key stays valid.
  AVATAR_URL: https://cdn.abalone.tudu.dev/avatars/8c73eb7cf5ba76ff8aeaac3ffd7b2b9557eb593553236335d88b37f8e1103f48.webp

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production
        id: check
        run: |
          failures=""

          # A check passes on a 200. The retries absorb a single dropped
          # connection; an outage fails all three attempts.
          check_status() {
            local url="$1"
            local status
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 2 --retry-all-errors --max-time 15 "$url" || true)
            echo "$status $url"
            if [ "$status" != "200" ]; then
              failures+="- \`$url\` answered HTTP $status, expected 200"$'\n'
            fi
          }

          # The health route must also report `data.status: "ok"`.
          check_health() {
            local url="$1"
            local body status
            body=$(curl --silent --fail --retry 2 --retry-all-errors --max-time 15 "$url" || true)
            status=$(echo "$body" | jq -r '.data.status // empty' 2>/dev/null || true)
            echo "health=${status:-none} $url"
            if [ "$status" != "ok" ]; then
              failures+="- \`$url\` did not report \`data.status: ok\` (got \`${status:-no answer}\`)"$'\n'
            fi
          }

          check_status https://abalone.tudu.dev
          check_status https://babaluje.tudu.dev
          check_health https://abalone.tudu.dev/api/v1/health
          check_health https://babaluje.tudu.dev/api/v1/health
          check_status "$AVATAR_URL"

          if [ -n "$failures" ]; then
            {
              echo "failures<<EOF"
              printf '%s' "$failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            printf '%s' "$failures" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All production checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Report the failure on an issue
        if: failure() && steps.check.outputs.failures != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILURES: ${{ steps.check.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'The production check failed on %s.\n\n%s\nRun: %s\n' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "$FAILURES" "$RUN_URL")
          open_issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
