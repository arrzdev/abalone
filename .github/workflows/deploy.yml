name: Deploy

# Production only: `main` deploys to the `production` GitHub Environment
# (changed units; every unit on a `force_all` dispatch). There is no staging.
# Any other ref fails in `discover`, and the Environment's deployment branch
# policy (`main` only) enforces the same on GitHub's side. What ships is
# .github/deploy-units.jsonc; the gate checks the whole repo regardless.
on:
  # Manual run. It deploys for real, it is not a dry run. `force_all` ignores
  # turbo --affected, which is what you want after changing a secret or a var,
  # or only `.github/**`: none of those moves a file inside a package.
  workflow_dispatch:
    inputs:
      force_all:
        description: "Redeploy every unit, ignoring turbo --affected (use after changing secrets/vars)"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - ".cursor/**"
      - ".vscode/**"
      - ".husky/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Ref check, debounce and discovery in one job (each job is billed a whole
  # minute).
  #
  # Debounce: sleep a short window so a burst of merges can land, then bail if
  # a newer commit is now the tip; only the latest commit deploys. Safe by
  # construction: with `cancel-in-progress: false` an in-flight deploy is never
  # interrupted, so this only skips work before it starts. If the tip lookup
  # fails it fails open and deploys. Manual dispatch is not debounced.
  #
  # Discovery reads the manifest and computes which units have a changed app
  # (turbo --affected). Adding an app is a line in the manifest, never an edit
  # here.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.ref.outputs.target }}
      units: ${{ steps.d.outputs.units }}
      any: ${{ steps.d.outputs.any }}
    steps:
      - name: Map ref to environment
        id: ref
        run: |
          case "$GITHUB_REF_NAME" in
            main) target=production ;;
            *)
              echo "::error::${GITHUB_REF_NAME} is not a deploy branch (only main deploys)"
              exit 1
              ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Debounce window
        if: github.event_name == 'push'
        run: sleep 45

      - name: Skip if superseded by a newer commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
          if [ -z "$tip" ] || [ "$tip" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Superseded by ${tip} on ${GITHUB_REF_NAME}, skipping stale deploy of ${GITHUB_SHA}"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.tip.outputs.latest == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # turbo --affected needs history back to the previous tip

      - name: Setup
        if: steps.tip.outputs.latest == 'true'
        uses: ./.github/actions/setup

      - name: Discover deploy units
        id: d
        if: steps.tip.outputs.latest == 'true'
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: node .github/scripts/deploy/discover.mjs

  # The post-merge gate: the same composite action ci.yml runs, in full mode.
  # A direct push to a deploy branch cannot ship a failure. No `environment:`
  # binding: verify uses no secrets, and binding it would couple the gate to
  # the environment's protection rules.
  verify:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # migration safety diffs new migrations against the previous tip

      - name: Gate
        uses: ./.github/actions/gate
        with:
          mode: full
          # Empty on dispatch: migration safety then diffs against origin/main;
          # all zeros on a branch's first push: it scans every migration.
          base: ${{ github.event.before }}

  # One generic job, matrixed over deploy units. Each unit deploys its changed
  # apps in order, fail-stop (unit.sh -> app.sh). Units run in parallel and one
  # unit's failure does not cancel another.
  deploy:
    needs: [discover, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.discover.outputs.target }}
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.discover.outputs.units) }}
    env:
      TARGET: ${{ needs.discover.outputs.target }}
      UNIT: ${{ matrix.unit.name }}
      AFFECTED: ${{ toJSON(matrix.unit.affected) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup
        uses: ./.github/actions/setup

      # The ONLY step that sees the Environment's app secrets. It writes each
      # app's env/.env from its schema (an allowlist) and prints key names only.
      #
      # Secrets are listed one by one as SECRET_<KEY>, never as
      # `toJSON(secrets)`: GitHub flags that on public repos as possibly
      # malicious and holds the run at `action_required` with no jobs. A new
      # secret in an env schema needs a line here (project fact).
      - name: Write env files from schema
        env:
          GH_VARS: ${{ toJSON(vars) }}
          SECRET_BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          printf '%s' "$AFFECTED" | jq -r '.[]' | while IFS= read -r app; do
            pnpm tsx .github/scripts/write-env-from-schema.ts "$app"
          done

      - name: Prepare Cloudflare account id
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          raw_len=${#CLOUDFLARE_ACCOUNT_ID}
          account_id="${CLOUDFLARE_ACCOUNT_ID//[!a-fA-F0-9]/}"
          clean_len=${#account_id}
          if [ "$raw_len" != "$clean_len" ]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID had ${raw_len} characters, sanitized to ${clean_len} hex (remove hidden chars in the GitHub secret/var)"
          fi
          if [ "$clean_len" -ne 32 ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hex characters (got ${clean_len} after sanitization)"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      # The token comes from `secrets` only: variables are not masked in logs.
      # app.sh strips it from the build's environment, so only wrangler sees it.
      - name: Deploy unit (ordered, fail-stop)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash .github/scripts/deploy/unit.sh
