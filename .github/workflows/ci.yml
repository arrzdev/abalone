name: CI

# The PR gate. Three jobs; `gate` is the one branch protection requires on
# `main`, and it passes only when `checks` and every `e2e` shard pass. No
# `push` trigger: deploy.yml's verify runs the same gate after the
# merge, so a CI run on the merged commit would be the same check a third time.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Everything but e2e. One job on purpose: every job is billed rounded up to a
  # whole minute, so small guards in their own jobs cost more than the work
  # they do. The draft and docs-only shortcuts live INSIDE the job, never as a
  # workflow `paths` filter: a required check whose workflow is skipped stays
  # pending forever.
  #
  # No `environment:` binding and no secrets: a PR that adds an env var passes
  # here without anyone provisioning an environment first, and forks run it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # migration safety and affected tests diff against the base

      - name: Choose gate mode
        id: mode
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          mode="$(bash .github/scripts/checks/gate-mode.sh)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Gate mode: **${mode}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Gate
        uses: ./.github/actions/gate
        with:
          mode: ${{ steps.mode.outputs.mode }}
          base: ${{ github.event.pull_request.base.sha }}
          e2e: "false"

  # The slowest step, split in two parallel shards so the suite can keep
  # growing inside the time limit. Full mode only, like the gate's own steps.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Choose gate mode
        id: mode
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: echo "mode=$(bash .github/scripts/checks/gate-mode.sh)" >> "$GITHUB_OUTPUT"

      - name: E2E (shard ${{ matrix.shard }})
        if: steps.mode.outputs.mode == 'full'
        uses: ./.github/actions/e2e
        with:
          shard: ${{ matrix.shard }}

  # The required check. Fixed name, so branch protection never changes when the
  # shard count does.
  gate:
    needs: [checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.e2e.result }}
        run: |
          echo "checks / e2e: $RESULTS"
          case "$RESULTS" in
            "success success") ;;
            *) exit 1 ;;
          esac
