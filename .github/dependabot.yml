# Actions are pinned by commit SHA (a tag can be moved, and the deploy job holds
# the Cloudflare token). Dependabot proposes the bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # npm: minor and patch bumps land together in one weekly PR; each major gets
  # its own PR, because a major can change behaviour. @repo/nativ is out of scope.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      - packages/nativ/**
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
