# Actions are pinned by commit SHA (a tag can be moved, and the deploy job holds
# the Cloudflare token). Dependabot proposes the bumps.
# Monthly, one grouped PR per ecosystem: Dependabot PRs get no Actions run, so
# each one needs a local check, and one PR a month is one check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  # npm: all bumps (majors included) land together in one monthly PR, and all
  # security updates in one more. A major that breaks the build is dropped from
  # the PR by hand (or added to ignore) so it does not hold the rest back.
  # @repo/nativ is out of scope.
  # Biome stays out of the group: its minors add recommended lint rules, so a
  # Biome bump needs code and config changes and would block every other bump.
  # The ignore list is what @repo/nativ pins as peers. Bumping them only in the
  # apps puts two copies of React and the router in the tree, so they move
  # together with nativ, by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    exclude-paths:
      - packages/nativ/**
    groups:
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "@biomejs/*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "@tanstack/react-router"
      - dependency-name: "@tanstack/react-start"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: vite
      - dependency-name: tailwindcss
      - dependency-name: motion
      - dependency-name: clsx
      - dependency-name: tailwind-merge
      - dependency-name: tailwindcss-safe-area
